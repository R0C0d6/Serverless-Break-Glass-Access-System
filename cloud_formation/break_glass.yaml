AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Break-Glass Access System - Phase 1 of 5.
  Grants table, permission boundary, and a break-glass-eligible EC2 instance.

Parameters:

  ProjectName:
    Type: String
    Default: breakglass
    Description: Prefix for every resource name in this stack.
    AllowedPattern: '^[a-z0-9-]+$'

  Environment:
    Type: String
    Default: dev
    Description: Environment suffix, so dev and prod can coexist.
    AllowedValues: [dev, prod]

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the test instance. The default VPC is fine.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet with outbound internet access. A default VPC public subnet works.

  InstanceType:
    Type: String
    Default: t3.micro
    Description: Instance size for the test target.
    # T2 does not exist in newer regions such as eu-north-1. T3 is available everywhere.
    AllowedValues: [t3.micro, t3.small]

  LatestAmazonLinux2Ami:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2
    Description: Resolves to the current Amazon Linux 2 AMI. Never hardcode AMI IDs.

  ApproverEmail:
    Type: String
    Description: Address that receives approval requests. Must be confirmed by hand after deploy.
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: must be a valid email address.

  ApiStageName:
    Type: String
    Default: prod
    Description: API Gateway stage name, which appears in the invoke URL.
    AllowedPattern: '^[a-z0-9]+$'

  EnableSecurityHub:
    Type: String
    Default: 'no'
    Description: >
      Security Hub is billed per check and fails to create if already enabled
      in this account and region. Set to yes only if it is currently off.
    AllowedValues: ['yes', 'no']

Conditions:

  ShouldEnableSecurityHub: !Equals [!Ref EnableSecurityHub, 'yes']

Resources:

  # ---------------------------------------------------------------------------
  # The grants table: one record per access request.
  # ---------------------------------------------------------------------------
  GrantsTable:
    Type: AWS::DynamoDB::Table
    # Flip both to Retain before production: an audit log should outlive its stack.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub '${ProjectName}-grants-${Environment}'
      # On-demand: idle most of the time, bursty during an incident.
      BillingMode: PAY_PER_REQUEST
      # Only key attributes are declared. DynamoDB is schemaless for the rest.
      AttributeDefinitions:
        - AttributeName: grant_id
          AttributeType: S
      KeySchema:
        - AttributeName: grant_id
          KeyType: HASH
      # 35-day restore window for the audit record.
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # Upgrades from an AWS-owned key to an AWS-managed KMS key in this account.
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # The permission boundary: the hard ceiling on the break-glass role.
  # ---------------------------------------------------------------------------
  PermissionBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${ProjectName}-permission-boundary-${Environment}'
      Description: Maximum scope any break-glass role can ever have. SSM sessions on tagged instances only.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:

          # Reach a machine only if someone deliberately tagged it.
          - Sid: StartSessionOnTaggedInstances
            Effect: Allow
            Action: ssm:StartSession
            Resource: 'arn:aws:ec2:*:*:instance/*'
            Condition:
              StringEquals:
                'ssm:resourceTag/BreakGlassEligible': 'true'

          # StartSession authorises against the session document too, not just the
          # instance. Omitting this is what caused the AccessDenied during testing.
          # The tag condition cannot apply here: a document carries no such tag.
          - Sid: StartSessionOnSessionDocument
            Effect: Allow
            Action: ssm:StartSession
            Resource:
              - 'arn:aws:ssm:*:*:document/SSM-SessionManagerRunShell'
              - 'arn:aws:ssm:*:*:document/AWS-StartSSHSession'

          # Managing a session you already hold. These act on session ARNs, not instances.
          - Sid: ManageOwnSessions
            Effect: Allow
            Action:
              - ssm:TerminateSession
              - ssm:ResumeSession
            Resource: 'arn:aws:ssm:*:*:session/*'

          # Read-only lookups. Neither supports resource-level permissions.
          - Sid: DescribeOnly
            Effect: Allow
            Action:
              - ssm:DescribeSessions
              - ssm:GetConnectionStatus
              - ec2:DescribeInstances
            Resource: '*'

  # ---------------------------------------------------------------------------
  # The target instance and the identity it needs to be reachable by SSM.
  # ---------------------------------------------------------------------------

  # SSM is agent-initiated: the instance calls out to AWS, so it needs its own role.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-instance-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      # AWS-managed policy with exactly the SSM agent permissions and nothing else.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${ProjectName}-instance-profile-${Environment}'
      Roles:
        - !Ref InstanceRole

  # No ingress rules at all. That absence is the entire point of this project.
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No inbound access. Outbound HTTPS only, for the SSM agent.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        # SSM agent reaches ssm, ec2messages and ssmmessages endpoints over 443.
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to AWS service endpoints
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-instance-sg-${Environment}'

  BreakGlassTargetInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmazonLinux2Ami
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      # No KeyName property: no SSH key exists, so SSH is impossible by construction.
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-target-${Environment}'
        # The tag the permission boundary keys on. Without it, this instance is invisible.
        - Key: BreakGlassEligible
          Value: 'true'
        - Key: Project
          Value: !Ref ProjectName

  # ---------------------------------------------------------------------------
  # Phase 2: the two-role spine. One role grants elevated access, the other does
  # the granting. Neither can do the other's job.
  # ---------------------------------------------------------------------------

  # The identity the Lambdas run as. Declared first and deliberately policy-free:
  # its permissions live in a separate resource below, to avoid a circular reference.
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-lambda-exec-${Environment}'
      Description: Execution role for the break-glass Lambdas. Highest-value identity in the system.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

  # The role that gets handed out during an incident. No standing access of its own.
  ElevatedAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-elevated-access-${Environment}'
      Description: Temporarily assumed for SSM access. Capped by the permission boundary.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Exactly one principal. No human can assume this, however privileged.
          - Effect: Allow
            Principal:
              AWS: !GetAtt LambdaExecutionRole.Arn
            Action:
              - sts:AssumeRole
              # Session tags are checked against BOTH the caller's policy and this
              # trust policy. Omit it here and tagged sessions fail.
              - sts:TagSession

      # The ceiling from Phase 1. Nothing attached later can exceed it.
      PermissionsBoundary: !Ref PermissionBoundary

      # Ceiling on how long an assumed session may last. The default is 1 hour,
      # which silently caps any grant longer than 60 minutes.
      MaxSessionDuration: 43200

      Policies:
        # Grants the same actions the boundary permits. Both must allow, so this
        # deliberate duplication is the second half of the double lock.
        - PolicyName: !Sub '${ProjectName}-elevated-access-inline-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: StartSessionOnTaggedInstances
                Effect: Allow
                Action: ssm:StartSession
                Resource: 'arn:aws:ec2:*:*:instance/*'
                Condition:
                  StringEquals:
                    'ssm:resourceTag/BreakGlassEligible': 'true'
              - Sid: StartSessionOnSessionDocument
                Effect: Allow
                Action: ssm:StartSession
                Resource:
                  - 'arn:aws:ssm:*:*:document/SSM-SessionManagerRunShell'
                  - 'arn:aws:ssm:*:*:document/AWS-StartSSHSession'
              - Sid: ManageOwnSessions
                Effect: Allow
                Action:
                  - ssm:TerminateSession
                  - ssm:ResumeSession
                Resource: 'arn:aws:ssm:*:*:session/*'
              - Sid: DescribeOnly
                Effect: Allow
                Action:
                  - ssm:DescribeSessions
                  - ssm:GetConnectionStatus
                  - ec2:DescribeInstances
                Resource: '*'

  # Split out of LambdaExecutionRole to break the dependency cycle: this policy
  # needs the elevated role's ARN, and the elevated role needs the Lambda role's ARN.
  LambdaExecutionPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${ProjectName}-lambda-exec-policy-${Environment}'
      Roles:
        - !Ref LambdaExecutionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:

          # One role, by ARN. Not "any role in the account".
          - Sid: AssumeBreakGlassRoleOnly
            Effect: Allow
            Action:
              - sts:AssumeRole
              - sts:TagSession
            Resource: !GetAtt ElevatedAccessRole.Arn

          # One table, by ARN, resolved from Phase 1 rather than pasted by hand.
          - Sid: GrantsTableAccess
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:UpdateItem
              - dynamodb:Query
              - dynamodb:Scan
            Resource: !GetAtt GrantsTable.Arn

          # Scoped to the topic Phase 4 will create, rather than the "*" the console build used.
          - Sid: PublishToApprovalsTopic
            Effect: Allow
            Action: sns:Publish
            Resource: !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${ProjectName}-approvals-${Environment}'

          # The failsafe scanner delegates cleanup to Auto-Revoke, and to nothing else.
          - Sid: InvokeAutoRevoke
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt AutoRevoke.Arn

          # Start exactly one state machine, not any in the account.
          - Sid: StartGrantTimer
            Effect: Allow
            Action: states:StartExecution
            Resource: !Ref GrantTimerStateMachine

          # Only this project's own log groups.
          - Sid: WriteOwnLogs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-*'

  # ---------------------------------------------------------------------------
  # Phase 4: notifications and the approval endpoint.
  # ---------------------------------------------------------------------------

  # Name must match the ARN the Lambda execution policy already scopes sns:Publish to.
  ApprovalsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-approvals-${Environment}'
      DisplayName: Break-Glass Approvals

  # CloudFormation can create this but cannot confirm it. The subscription reports
  # CREATE_COMPLETE while sitting in PendingConfirmation until the link is clicked.
  #
  # Renamed from ApproverSubscription to force a brand new subscription: the old
  # one reached Deleted, and a confirmation token is bound to one subscription only.
  # Confirm the new email BEFORE redeploying, or this repeats.
  ApproverSubscriptionV2:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref ApprovalsTopic
      Protocol: email
      Endpoint: !Ref ApproverEmail

  ApprovalApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${ProjectName}-approval-api-${Environment}'
      Description: Serves the approval link embedded in the request email.
      EndpointConfiguration:
        Types: [REGIONAL]

  # The /approve path.
  ApproveResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApprovalApi
      ParentId: !GetAtt ApprovalApi.RootResourceId
      PathPart: approve

  # AWS_PROXY passes the whole request, including query strings, to the Lambda.
  ApproveMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApprovalApi
      ResourceId: !Ref ApproveResource
      HttpMethod: GET
      # No authorizer. See Known Limitations 1 and 2: anyone with the link can approve.
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        # Always POST: this is how API Gateway talks to Lambda, regardless of the client's verb.
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApprovalHandler.Arn}/invocations'

  # Without this, API Gateway returns 500 on every call. The console asks
  # "Add Permission to Lambda Function?" and does it for you.
  ApprovalHandlerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApprovalHandler
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApprovalApi}/*/GET/approve'

  # DependsOn is mandatory: without it CloudFormation can deploy before the method
  # exists, producing a live API with no routes.
  ApprovalApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: ApproveMethod
    Properties:
      RestApiId: !Ref ApprovalApi

  ApprovalApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref ApprovalApi
      DeploymentId: !Ref ApprovalApiDeployment
      StageName: !Ref ApiStageName

  # ---------------------------------------------------------------------------
  # Phase 3: the three Lambdas. Every ARN arrives as an environment variable,
  # so nothing is hardcoded and the same code deploys to any environment.
  # ---------------------------------------------------------------------------

  # Step Functions needs its own identity. It can invoke exactly one function.
  StateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-statemachine-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub '${ProjectName}-statemachine-invoke-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt AutoRevoke.Arn

  # The grant timer: wait out the duration, then hand the grant to Auto-Revoke.
  # Two states, no branching, so the whole thing is auditable at a glance.
  GrantTimerStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${ProjectName}-grant-timer-${Environment}'
      # Standard, not Express: Express caps at 5 minutes and cannot hold a long wait.
      StateMachineType: STANDARD
      RoleArn: !GetAtt StateMachineRole.Arn
      # $.wait_seconds and grant_id.$ survive !Sub untouched: only ${...} is substituted.
      DefinitionString: !Sub |
        {
          "Comment": "Waits out the grant duration, then triggers auto-revoke.",
          "StartAt": "WaitForGrantDuration",
          "States": {
            "WaitForGrantDuration": {
              "Type": "Wait",
              "SecondsPath": "$.wait_seconds",
              "Next": "AutoRevoke"
            },
            "AutoRevoke": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${AutoRevoke.Arn}",
                "Payload": { "grant_id.$": "$.grant_id" }
              },
              "ResultPath": null,
              "End": true
            }
          }
        }

  RequestHandler:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-request-handler-${Environment}'
      Description: Accepts an access request, writes it as pending, and starts the timer.
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref GrantsTable
          SNS_TOPIC_ARN: !Ref ApprovalsTopic
          # Built from the API and stage, so no invoke URL is ever pasted by hand.
          APPROVAL_BASE_URL: !Sub 'https://${ApprovalApi}.execute-api.${AWS::Region}.amazonaws.com/${ApprovalApiStage}'
          APPROVER_EMAIL: !Ref ApproverEmail
          STATE_MACHINE_ARN: !Ref GrantTimerStateMachine
      Code:
        ZipFile: |
          import json, os, uuid, boto3
          from datetime import datetime, timezone

          TABLE = os.environ['TABLE_NAME']
          TOPIC = os.environ.get('SNS_TOPIC_ARN', '')
          BASE_URL = os.environ.get('APPROVAL_BASE_URL', '')
          APPROVER = os.environ.get('APPROVER_EMAIL', '')
          SFN_ARN = os.environ.get('STATE_MACHINE_ARN', '')
          ddb = boto3.resource('dynamodb')
          sns = boto3.client('sns')
          sfn = boto3.client('stepfunctions')

          def lambda_handler(event, context):
              raw = event.get('body')
              body = json.loads(raw) if isinstance(raw, str) else event
              requester = body.get('requester')
              instance_id = body.get('instance_id')
              reason = body.get('reason')
              duration = int(body.get('duration_minutes', 30))

              if not all([requester, instance_id, reason]):
                  return {'statusCode': 400, 'body': json.dumps(
                      {'error': 'requester, instance_id and reason are required'})}

              grant_id = str(uuid.uuid4())
              ddb.Table(TABLE).put_item(Item={
                  'grant_id': grant_id, 'requester': requester,
                  'instance_id': instance_id, 'reason': reason,
                  'duration_minutes': duration, 'status': 'pending',
                  'requested_at': datetime.now(timezone.utc).isoformat(),
                  'approver': 'none', 'approved_at': 'none', 'expires_at': 'none'})

              # Start the timer before notifying. If SNS fails the grant still expires;
              # the reverse order would leave a grant that never times out.
              # grant_id as the execution name makes a retry idempotent.
              if SFN_ARN:
                  sfn.start_execution(stateMachineArn=SFN_ARN, name=grant_id,
                      input=json.dumps({'grant_id': grant_id,
                                        'wait_seconds': duration * 60}))

              if TOPIC:
                  link = f"{BASE_URL}/approve?grant_id={grant_id}&approver={APPROVER}"
                  sns.publish(TopicArn=TOPIC,
                      Subject='ACTION REQUIRED: Break-Glass Access Request',
                      Message=(f"Requester: {requester}\nInstance: {instance_id}\n"
                               f"Reason: {reason}\nDuration: {duration} min\n"
                               f"Grant ID: {grant_id}\n\n"
                               f"To APPROVE, click:\n{link}\n\n"
                               f"To deny, ignore this email."))

              return {'statusCode': 200, 'body': json.dumps(
                  {'grant_id': grant_id, 'status': 'pending'})}

  ApprovalHandler:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-approval-handler-${Environment}'
      Description: Validates an approval, then mints scoped temporary credentials.
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref GrantsTable
          BREAK_GLASS_ROLE_ARN: !GetAtt ElevatedAccessRole.Arn
          SNS_TOPIC_ARN: !Ref ApprovalsTopic
      Code:
        ZipFile: |
          import json, os, boto3
          from datetime import datetime, timezone
          from botocore.exceptions import ClientError

          TABLE = os.environ['TABLE_NAME']
          ROLE_ARN = os.environ['BREAK_GLASS_ROLE_ARN']
          TOPIC = os.environ.get('SNS_TOPIC_ARN', '')
          ddb = boto3.resource('dynamodb')
          sts = boto3.client('sts')
          sns = boto3.client('sns')

          def lambda_handler(event, context):
              p = event.get('queryStringParameters') or event
              grant_id, approver = p.get('grant_id'), p.get('approver')
              if not grant_id or not approver:
                  return {'statusCode': 400, 'body': json.dumps(
                      {'error': 'grant_id and approver are required'})}

              t = ddb.Table(TABLE)
              item = t.get_item(Key={'grant_id': grant_id}).get('Item')
              if not item:
                  return {'statusCode': 404, 'body': json.dumps({'error': 'Grant not found'})}
              if item['requester'] == approver:
                  return {'statusCode': 403, 'body': json.dumps(
                      {'error': 'Requester cannot approve their own request'})}

              # Claim the grant before minting anything. The condition means two
              # simultaneous clicks cannot both succeed and issue two sessions.
              try:
                  t.update_item(Key={'grant_id': grant_id},
                      UpdateExpression='SET #s=:active, approver=:p, approved_at=:t',
                      ConditionExpression='#s = :pending',
                      ExpressionAttributeNames={'#s': 'status'},
                      ExpressionAttributeValues={':active': 'active', ':p': approver,
                          ':pending': 'pending',
                          ':t': datetime.now(timezone.utc).isoformat()})
              except ClientError as e:
                  if e.response['Error']['Code'] == 'ConditionalCheckFailedException':
                      return {'statusCode': 409, 'body': json.dumps(
                          {'error': f"Grant is already {item['status']}"})}
                  raise

              secs = min(int(item.get('duration_minutes', 30)) * 60, 43200)
              c = sts.assume_role(RoleArn=ROLE_ARN,
                  RoleSessionName=f"breakglass-{grant_id[:8]}",
                  DurationSeconds=secs,
                  Tags=[{'Key': 'GrantId', 'Value': grant_id},
                        {'Key': 'Requester', 'Value': item['requester']},
                        {'Key': 'Approver', 'Value': approver}])['Credentials']

              expires = c['Expiration'].isoformat()
              t.update_item(Key={'grant_id': grant_id},
                  UpdateExpression='SET expires_at=:e',
                  ExpressionAttributeValues={':e': expires})

              if TOPIC:
                  sns.publish(TopicArn=TOPIC, Subject='Break-Glass Access APPROVED',
                      Message=(f"Grant: {grant_id}\nRequester: {item['requester']}\n"
                               f"Approver: {approver}\nExpires: {expires}\n\n"
                               f"AWS_ACCESS_KEY_ID={c['AccessKeyId']}\n"
                               f"AWS_SECRET_ACCESS_KEY={c['SecretAccessKey']}\n"
                               f"AWS_SESSION_TOKEN={c['SessionToken']}"))

              return {'statusCode': 200, 'body': json.dumps(
                  {'message': 'Access approved', 'grant_id': grant_id,
                   'expires_at': expires})}

  AutoRevoke:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-auto-revoke-${Environment}'
      Description: Marks a grant expired once its window closes.
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref GrantsTable
          SNS_TOPIC_ARN: !Ref ApprovalsTopic
      Code:
        ZipFile: |
          import json, os, boto3
          from datetime import datetime, timezone

          TABLE = os.environ['TABLE_NAME']
          TOPIC = os.environ.get('SNS_TOPIC_ARN', '')
          ddb = boto3.resource('dynamodb')
          sns = boto3.client('sns')

          def lambda_handler(event, context):
              grant_id = event.get('grant_id')
              if not grant_id:
                  return {'statusCode': 400, 'body': json.dumps(
                      {'error': 'grant_id is required'})}

              t = ddb.Table(TABLE)
              item = t.get_item(Key={'grant_id': grant_id}).get('Item')
              if not item:
                  return {'statusCode': 404, 'body': json.dumps({'error': 'Grant not found'})}
              if item['status'] == 'expired':
                  return {'statusCode': 200, 'body': json.dumps(
                      {'message': 'Already expired, nothing to do'})}

              revoked = datetime.now(timezone.utc).isoformat()
              t.update_item(Key={'grant_id': grant_id},
                  UpdateExpression='SET #s=:s, revoked_at=:r',
                  ExpressionAttributeNames={'#s': 'status'},
                  ExpressionAttributeValues={':s': 'expired', ':r': revoked})

              if TOPIC:
                  sns.publish(TopicArn=TOPIC, Subject='Break-Glass Access REVOKED',
                      Message=(f"Grant: {grant_id}\n"
                               f"Requester: {item.get('requester', 'unknown')}\n"
                               f"Revoked at: {revoked}\n\n"
                               f"The STS credentials for this session have expired."))

              return {'statusCode': 200, 'body': json.dumps(
                  {'message': 'Grant revoked', 'grant_id': grant_id})}

  # Declared explicitly so logs expire. Lambda's own log groups never do by default.
  RequestHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-request-handler-${Environment}'
      RetentionInDays: 14

  ApprovalHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-approval-handler-${Environment}'
      RetentionInDays: 14

  AutoRevokeLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-auto-revoke-${Environment}'
      RetentionInDays: 14

  # ---------------------------------------------------------------------------
  # Phase 5: audit and failsafe. Everything here assumes the rest will fail.
  # ---------------------------------------------------------------------------

  # Account ID in the name because bucket names are globally unique.
  CloudTrailBucket:
    Type: AWS::S3::Bucket
    # Deleting the stack fails while this holds objects. Empty it first.
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub '${ProjectName}-cloudtrail-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldLogs
            Status: Enabled
            ExpirationInDays: 90

  # CloudTrail checks it can write here before the trail will create at all.
  CloudTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudTrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt CloudTrailBucket.Arn
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${CloudTrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                's3:x-amz-acl': bucket-owner-full-control

  # DependsOn is required: the trail validates bucket permissions on creation,
  # and CloudFormation would otherwise race the policy.
  AuditTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: CloudTrailBucketPolicy
    Properties:
      TrailName: !Sub '${ProjectName}-audit-trail-${Environment}'
      S3BucketName: !Ref CloudTrailBucket
      IsLogging: true
      # AssumeRole can happen in any region, so the trail has to watch all of them.
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      # Hashes each log file so tampering is detectable.
      EnableLogFileValidation: true

  # Optional: billed per check, and creation fails if already enabled.
  SecurityHub:
    Type: AWS::SecurityHub::Hub
    Condition: ShouldEnableSecurityHub

  # EventBridge cannot publish to SNS without this. The console adds it silently;
  # CloudFormation does not, and the rule then fails with no visible error.
  ApprovalsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref ApprovalsTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref ApprovalsTopic

  # The tripwire. Fires on every assumption of the break-glass role, including
  # legitimate ones: an alert nobody requested is the signal.
  AssumeRoleAlertRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-assumerole-alert-${Environment}'
      Description: Alerts in real time whenever the break-glass role is assumed.
      State: ENABLED
      EventPattern:
        source:
          - aws.sts
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventSource:
            - sts.amazonaws.com
          eventName:
            - AssumeRole
          requestParameters:
            roleArn:
              - !GetAtt ElevatedAccessRole.Arn
      Targets:
        - Id: ApprovalsTopicTarget
          Arn: !Ref ApprovalsTopic

  # Catches grants Step Functions never expired: a failed, stopped or never-started
  # execution leaves a record claiming active long after its credentials died.
  FailsafeScanner:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-failsafe-scanner-${Environment}'
      Description: Sweeps for grants past expiry but still marked active.
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      Environment:
        Variables:
          TABLE_NAME: !Ref GrantsTable
          SNS_TOPIC_ARN: !Ref ApprovalsTopic
          AUTO_REVOKE_NAME: !Ref AutoRevoke
      Code:
        ZipFile: |
          import json, os, boto3
          from datetime import datetime, timezone

          TABLE = os.environ['TABLE_NAME']
          TOPIC = os.environ.get('SNS_TOPIC_ARN', '')
          TARGET = os.environ['AUTO_REVOKE_NAME']
          ddb = boto3.resource('dynamodb')
          sns = boto3.client('sns')
          lam = boto3.client('lambda')

          def lambda_handler(event, context):
              t = ddb.Table(TABLE)
              now = datetime.now(timezone.utc).isoformat()
              # expires_at is ISO-8601 UTC, so string ordering is chronological.
              resp = t.scan(
                  FilterExpression='#s = :active AND expires_at < :now',
                  ExpressionAttributeNames={'#s': 'status'},
                  ExpressionAttributeValues={':active': 'active', ':now': now})
              stale = resp.get('Items', [])

              for g in stale:
                  # Event = fire and forget. One slow revoke cannot stall the sweep.
                  lam.invoke(FunctionName=TARGET, InvocationType='Event',
                             Payload=json.dumps({'grant_id': g['grant_id']}))

              if stale and TOPIC:
                  ids = ', '.join(g['grant_id'] for g in stale)
                  sns.publish(TopicArn=TOPIC,
                      Subject=f'Failsafe: {len(stale)} expired grant(s) force-revoked',
                      Message=(f"Found {len(stale)} grant(s) past expiry but still "
                               f"active. Auto-Revoke triggered for each.\n\n{ids}"))

              return {'statusCode': 200, 'body': json.dumps(
                  {'scanned': True, 'revoked_count': len(stale)})}

  FailsafeScannerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-failsafe-scanner-${Environment}'
      RetentionInDays: 14

  FailsafeScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-failsafe-schedule-${Environment}'
      Description: Runs the failsafe sweep every five minutes.
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Id: FailsafeScannerTarget
          Arn: !GetAtt FailsafeScanner.Arn

  # A schedule rule cannot invoke a function without explicit permission.
  FailsafeScannerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FailsafeScanner
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt FailsafeScheduleRule.Arn

Outputs:

  GrantsTableName:
    Description: Name of the grants table.
    Value: !Ref GrantsTable
    Export:
      Name: !Sub '${AWS::StackName}-GrantsTableName'

  GrantsTableArn:
    Description: Grants table ARN, for scoping IAM policies in Phase 2.
    Value: !GetAtt GrantsTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-GrantsTableArn'

  PermissionBoundaryArn:
    Description: Boundary ARN. Phase 2 attaches this to the break-glass role.
    Value: !Ref PermissionBoundary
    Export:
      Name: !Sub '${AWS::StackName}-PermissionBoundaryArn'

  TargetInstanceId:
    Description: Instance ID to use as the SSM session target when testing.
    Value: !Ref BreakGlassTargetInstance
    Export:
      Name: !Sub '${AWS::StackName}-TargetInstanceId'

  ApprovalsTopicArn:
    Description: SNS topic every notification flows through.
    Value: !Ref ApprovalsTopic
    Export:
      Name: !Sub '${AWS::StackName}-ApprovalsTopicArn'

  GrantTimerStateMachineArn:
    Description: State machine that times each grant out.
    Value: !Ref GrantTimerStateMachine
    Export:
      Name: !Sub '${AWS::StackName}-GrantTimerStateMachineArn'

  AuditTrailBucket:
    Description: Bucket holding the CloudTrail logs. Empty it before deleting the stack.
    Value: !Ref CloudTrailBucket

  FailsafeScannerName:
    Description: Invoke manually with {} to run the sweep on demand.
    Value: !Ref FailsafeScanner

  ApprovalApiUrl:
    Description: Base invoke URL. Append /approve?grant_id=...&approver=... to use it.
    Value: !Sub 'https://${ApprovalApi}.execute-api.${AWS::Region}.amazonaws.com/${ApprovalApiStage}'
    Export:
      Name: !Sub '${AWS::StackName}-ApprovalApiUrl'

  ElevatedAccessRoleArn:
    Description: Role the Approval Handler assumes to mint credentials.
    Value: !GetAtt ElevatedAccessRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ElevatedAccessRoleArn'

  LambdaExecutionRoleArn:
    Description: Execution role for every Lambda in Phase 3.
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaExecutionRoleArn'
